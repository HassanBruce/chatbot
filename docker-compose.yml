services:
  wabot:
    build: .
    container_name: wabot
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"   # only nginx can reach it
    volumes:
      - ./businesses:/app/businesses   # edit rates without rebuilding, then send #reload
      - ./data:/app/data               # sessions + orders.jsonl
